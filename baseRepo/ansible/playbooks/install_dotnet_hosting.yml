---
- name: Install .NET 8 Hosting Bundle on Windows targets
  hosts: windows_web
  gather_facts: no
  tasks:
    - name: Ensure temp directory exists
      ansible.windows.win_file:
        path: C:\\temp
        state: directory

    - name: Download .NET Hosting Bundle
      ansible.windows.win_get_url:
        url: "https://dotnetcli.azureedge.net/dotnet/WindowsHostingBundle/8.0.0/dotnet-hosting-8.0.0-win.exe"
        dest: C:\\temp\\dotnet-hosting-8.exe
        mode: '0644'

    - name: Install .NET Hosting Bundle silently
      ansible.windows.win_shell: |
        Start-Process -FilePath 'C:\\temp\\dotnet-hosting-8.exe' -ArgumentList '/install','/quiet','/norestart' -Wait
      register: hosting_install
      ignore_errors: yes

    - name: Show install result
      ansible.windows.win_debug:
        msg: "Install rc={{ hosting_install.rc }} stdout={{ hosting_install.stdout }} stderr={{ hosting_install.stderr }}"

    - name: Remove installer
      ansible.windows.win_file:
        path: C:\\temp\\dotnet-hosting-8.exe
        state: absent

  # Note: The inventory should target ASG instances via tags (use ec2_dynamic inventory or SSM inventory plugin).
